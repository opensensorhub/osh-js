name: Deploy showcase to GitHub Pages
on:
  push:
    branches: [dev]
    paths:
      - 'showcase/**'
      - 'source/**'
      - '.github/workflows/showcase_build.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '16.20.2'

      - name: Enable Corepack
        run: corepack enable

      - name: Install showcase dependencies
        run: yarn --cwd showcase install --frozen-lockfile

      - name: Build showcase
        run: yarn --cwd showcase prod

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: showcase/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
